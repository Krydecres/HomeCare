# customer-service (SV05). Every secret comes from environment variables (.env, never committed) – R-17.
server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful

spring:
  application:
    name: customer-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/homecare}
    username: ${DB_USERNAME:customer_svc}
    password: ${DB_PASSWORD}
    hikari:
      # 12 services share one PostgreSQL (OQ-001): keep pools small.
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: customer
        jdbc:
          time_zone: UTC
  flyway:
    schemas: customer
    default-schema: customer
    create-schemas: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:homecare}
    password: ${RABBITMQ_PASSWORD}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

homecare:
  security:
    encryption-key: ${HOMECARE_ENCRYPTION_KEY:}
    jwt:
      issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/homecare}
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/homecare/protocol/openid-connect/certs}
      audience: homecare-api

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
