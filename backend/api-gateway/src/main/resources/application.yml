eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

homecare:
  security:
    jwt:
      issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/homecare}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui
    urls:
      - name: api-gateway
        url: /v3/api-docs
      - name: identity-service
        url: /v3/api-docs/identity-service
      - name: customer-service
        url: /v3/api-docs/customer-service
      - name: caregiver-service
        url: /v3/api-docs/caregiver-service
      - name: catalog-service
        url: /v3/api-docs/catalog-service
      - name: booking-service
        url: /v3/api-docs/booking-service
      - name: dispatch-service
        url: /v3/api-docs/dispatch-service
      - name: care-record-service
        url: /v3/api-docs/care-record-service
      - name: payment-service
        url: /v3/api-docs/payment-service
      - name: notification-service
        url: /v3/api-docs/notification-service
      - name: review-service
        url: /v3/api-docs/review-service
      - name: incident-service
        url: /v3/api-docs/incident-service
      - name: report-service
        url: /v3/api-docs/report-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
