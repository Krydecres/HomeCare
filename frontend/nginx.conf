# Web container (profile "full"): SPA files + same-origin proxy of the BFF paths to api-gateway.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker DNS, re-resolved so a recreated api-gateway container (new IP) does not cause 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;

    # Same CSP as the gateway (GatewaySecurityConfig.CONTENT_SECURITY_POLICY) – keep both in sync.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.tile.openstreetmap.org; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ ^/(api|oauth2|login/oauth2|logout|v3/api-docs|swagger-ui)(/|$) {
        proxy_pass $gateway;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
