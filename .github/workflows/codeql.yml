# Quét bảo mật mã nguồn (US-15-005). Cần repo public hoặc GitHub Advanced Security / Education.
name: codeql
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.language == 'java-kotlin'
        run: cd backend && sh mvnw -B -ntp -DskipTests package
      - uses: github/codeql-action/analyze@v3
