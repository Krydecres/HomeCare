# HomeCare – local environment (US-15-002). Run from the repo root:
#   python scripts/init-dev-env.py                          # once: creates infra/.env with random dev secrets
#   docker compose -f infra/docker-compose.yml --profile infra up -d   # only infrastructure, run services from the IDE
#   bash scripts/build-images.sh && docker compose -f infra/docker-compose.yml --profile full up -d   # everything
#
# Ports are bound to 127.0.0.1 only. In profile "full" the business services publish NO port: they are reachable only
# on the internal Docker network through api-gateway (US-15-003). Secrets come from infra/.env (never committed).
name: homecare

x-service-env: &service-env
  CONFIG_SERVER_URL: http://config-server:8888
  EUREKA_URL: http://discovery-server:8761/eureka
  DB_URL: jdbc:postgresql://postgres:5432/homecare
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?run scripts/init-dev-env.py}
  KEYCLOAK_ISSUER: http://localhost:8180/realms/homecare
  KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/homecare/protocol/openid-connect/certs
  HOMECARE_ENCRYPTION_KEY: ${HOMECARE_ENCRYPTION_KEY:?run scripts/init-dev-env.py}
  MANAGEMENT_TRACING_EXPORT_ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
  SWAGGER_ENABLED: "true"

x-service: &service
  profiles: [full]
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }
    keycloak: { condition: service_healthy }
    discovery-server: { condition: service_started }
    config-server: { condition: service_started }

services:
  # ---------------------------------------------------------------- infrastructure (profiles infra + full)
  postgres:
    image: postgis/postgis:17-3.5
    profiles: [infra, full]
    restart: unless-stopped
    # 12 services × pool 5 + Keycloak + IDE/tests stay well below this.
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: homecare
      POSTGRES_USER: homecare_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-dev-env.py}
      DB_PASSWORD_IDENTITY: ${DB_PASSWORD_IDENTITY}
      DB_PASSWORD_CUSTOMER: ${DB_PASSWORD_CUSTOMER}
      DB_PASSWORD_CAREGIVER: ${DB_PASSWORD_CAREGIVER}
      DB_PASSWORD_CATALOG: ${DB_PASSWORD_CATALOG}
      DB_PASSWORD_BOOKING: ${DB_PASSWORD_BOOKING}
      DB_PASSWORD_DISPATCH: ${DB_PASSWORD_DISPATCH}
      DB_PASSWORD_CARE_RECORD: ${DB_PASSWORD_CARE_RECORD}
      DB_PASSWORD_PAYMENT: ${DB_PASSWORD_PAYMENT}
      DB_PASSWORD_NOTIFICATION: ${DB_PASSWORD_NOTIFICATION}
      DB_PASSWORD_REVIEW: ${DB_PASSWORD_REVIEW}
      DB_PASSWORD_INCIDENT: ${DB_PASSWORD_INCIDENT}
      DB_PASSWORD_REPORT: ${DB_PASSWORD_REPORT}
      DB_PASSWORD_KEYCLOAK: ${DB_PASSWORD_KEYCLOAK}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homecare_admin -d homecare"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    profiles: [infra, full]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run scripts/init-dev-env.py}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    profiles: [infra, full]
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: homecare
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
      - "127.0.0.1:61613:61613"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    profiles: [infra, full]
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/homecare
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: keycloak_svc
      KC_DB_PASSWORD: ${DB_PASSWORD_KEYCLOAK}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run scripts/init-dev-env.py}
      # Browser and tokens always use http://localhost:8180 (issuer); containers reach Keycloak at http://keycloak:8080.
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Placeholders used inside infra/keycloak/homecare-realm.json
      HOMECARE_WEB_URL: ${HOMECARE_WEB_URL:-http://localhost:5173}
      HOMECARE_DEV_USER_PASSWORD: ${HOMECARE_DEV_USER_PASSWORD}
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET}
      KC_SECRET_IDENTITY_SERVICE: ${KC_SECRET_IDENTITY_SERVICE}
      KC_SECRET_CUSTOMER_SERVICE: ${KC_SECRET_CUSTOMER_SERVICE}
      KC_SECRET_CAREGIVER_SERVICE: ${KC_SECRET_CAREGIVER_SERVICE}
      KC_SECRET_CATALOG_SERVICE: ${KC_SECRET_CATALOG_SERVICE}
      KC_SECRET_BOOKING_SERVICE: ${KC_SECRET_BOOKING_SERVICE}
      KC_SECRET_DISPATCH_SERVICE: ${KC_SECRET_DISPATCH_SERVICE}
      KC_SECRET_CARE_RECORD_SERVICE: ${KC_SECRET_CARE_RECORD_SERVICE}
      KC_SECRET_PAYMENT_SERVICE: ${KC_SECRET_PAYMENT_SERVICE}
      KC_SECRET_NOTIFICATION_SERVICE: ${KC_SECRET_NOTIFICATION_SERVICE}
      KC_SECRET_REVIEW_SERVICE: ${KC_SECRET_REVIEW_SERVICE}
      KC_SECRET_INCIDENT_SERVICE: ${KC_SECRET_INCIDENT_SERVICE}
      KC_SECRET_REPORT_SERVICE: ${KC_SECRET_REPORT_SERVICE}
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:8180:8080"]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  zipkin:
    image: openzipkin/zipkin:3
    profiles: [infra, full]
    restart: unless-stopped
    ports: ["127.0.0.1:9411:9411"]

  # S3-compatible storage (02_Tech_Stack "MinIO/Garage"; MinIO no longer publishes images). First run:
  #   bash scripts/init-storage.sh
  garage:
    image: dxflrs/garage:v2.1.0
    profiles: [infra, full]
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run scripts/init-dev-env.py}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    ports: ["127.0.0.1:3900:3900"]

  # ---------------------------------------------------------------- platform services (profile full)
  discovery-server:
    profiles: [full]
    build: { context: ../backend, args: { MODULE: discovery-server } }
    restart: unless-stopped
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    ports: ["127.0.0.1:8761:8761"]

  config-server:
    profiles: [full]
    build: { context: ../backend, args: { MODULE: config-server } }
    restart: unless-stopped
    environment:
      CONFIG_NATIVE_LOCATION: file:/config-repo
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    volumes:
      - ./config-repo:/config-repo:ro

  api-gateway:
    <<: *service
    build: { context: ../backend, args: { MODULE: api-gateway } }
    depends_on:
      redis: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      discovery-server: { condition: service_started }
      config-server: { condition: service_started }
    environment:
      <<: *service-env
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_BFF_CLIENT_SECRET: ${KEYCLOAK_BFF_CLIENT_SECRET}
    ports: ["127.0.0.1:8080:8080"]

  identity-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: identity-service } }
    environment: { <<: *service-env, DB_USERNAME: identity_svc, DB_PASSWORD: "${DB_PASSWORD_IDENTITY}" }
  customer-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: customer-service } }
    environment: { <<: *service-env, DB_USERNAME: customer_svc, DB_PASSWORD: "${DB_PASSWORD_CUSTOMER}" }
  caregiver-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: caregiver-service } }
    environment: { <<: *service-env, DB_USERNAME: caregiver_svc, DB_PASSWORD: "${DB_PASSWORD_CAREGIVER}" }
  catalog-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: catalog-service } }
    environment: { <<: *service-env, DB_USERNAME: catalog_svc, DB_PASSWORD: "${DB_PASSWORD_CATALOG}" }
  booking-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: booking-service } }
    environment: { <<: *service-env, DB_USERNAME: booking_svc, DB_PASSWORD: "${DB_PASSWORD_BOOKING}" }
  dispatch-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: dispatch-service } }
    environment: { <<: *service-env, DB_USERNAME: dispatch_svc, DB_PASSWORD: "${DB_PASSWORD_DISPATCH}" }
  care-record-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: care-record-service } }
    environment: { <<: *service-env, DB_USERNAME: care_record_svc, DB_PASSWORD: "${DB_PASSWORD_CARE_RECORD}" }
  payment-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: payment-service } }
    environment: { <<: *service-env, DB_USERNAME: payment_svc, DB_PASSWORD: "${DB_PASSWORD_PAYMENT}" }
  notification-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: notification-service } }
    environment: { <<: *service-env, DB_USERNAME: notification_svc, DB_PASSWORD: "${DB_PASSWORD_NOTIFICATION}" }
  review-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: review-service } }
    environment: { <<: *service-env, DB_USERNAME: review_svc, DB_PASSWORD: "${DB_PASSWORD_REVIEW}" }
  incident-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: incident-service } }
    environment: { <<: *service-env, DB_USERNAME: incident_svc, DB_PASSWORD: "${DB_PASSWORD_INCIDENT}" }
  report-service:
    <<: *service
    build: { context: ../backend, args: { MODULE: report-service } }
    environment: { <<: *service-env, DB_USERNAME: report_svc, DB_PASSWORD: "${DB_PASSWORD_REPORT}" }

  # ---------------------------------------------------------------- web (profile full): static files + same-origin proxy
  web:
    profiles: [full]
    build: { context: ../frontend }
    restart: unless-stopped
    depends_on:
      api-gateway: { condition: service_started }
    ports: ["127.0.0.1:5173:80"]

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  garagemeta:
  garagedata:
